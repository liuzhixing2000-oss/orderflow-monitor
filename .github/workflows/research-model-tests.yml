name: Research model tests

on:
  pull_request:
    paths:
      - "research_models.py"
      - "engine.py"
      - "config.py"
      - "test_research_models.py"
      - ".github/workflows/research-model-tests.yml"
  push:
    branches:
      - "research/regime-model-v0.1"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run research-model tests
        run: python -m unittest test_research_models.py
