name: Frozen orderflow audit
on:
  push:
    branches: [audit/orderflow-edge-v01]
    paths: ['audit/**', '.github/workflows/orderflow-audit.yml']
  pull_request:
    paths: ['audit/**', '.github/workflows/orderflow-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r audit/requirements.txt
      - run: python audit/run_audit.py
      - run: python -m unittest discover -s audit -p 'test_*.py' -v
